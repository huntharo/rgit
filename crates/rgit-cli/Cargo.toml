[package]
name = "rgit-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "rgit"
path = "src/main.rs"

[dependencies]
rgit-core = { path = "../rgit-core" }
clap.workspace = true
dunce.workspace = true

[dev-dependencies]
# Integration tests drive the binary with test-only failpoints enabled.
rgit-core = { path = "../rgit-core", features = ["failpoints"] }
tempfile.workspace = true

[lints]
workspace = true
