[package]
name = "rgit-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Test-only fault injection (see src/write/failpoint.rs). Never enable in releases.
failpoints = []

[dependencies]
gix.workspace = true
similar.workspace = true

# Safe atomic no-replace rename and no-follow/non-blocking opens (already in
# the dependency tree through gix; never used with `unsafe` in this crate).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "fs"] }

[target.'cfg(windows)'.dependencies]
# Safe GetFileInformationByHandle for stable (volume serial, file index)
# identity; already in the dependency tree through gix-fs.
winapi-util = "=0.1.11"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
