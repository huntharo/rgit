[workspace]
members = ["crates/rgit-core", "crates/rgit-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/huntharo/rgit"
publish = false

[workspace.dependencies]
gix = { version = "=0.90.0", default-features = false, features = ["sha1", "sha256", "revision", "status"] }
similar = { version = "=2.7.0", features = ["bytes"] }
clap = { version = "4.6", features = ["derive"] }
tempfile = "3.27"
dunce = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
